name: Code Quality Check

on:
  push:
    branches: 
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # or latest

      - name: Use Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Recommended LTS version
          cache: pnpm

      - name: Install Dep
        run: pnpm install 

      - name: Genereate Prisma
        run: pnpm prisma generate

      - name: Build Project
        run: pnpm build