name: Docker Deploy

on:
  workflow_run:
    workflows:
        - "Code Quality Check"
    types:
        - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success'}}

    runs-on: ubuntu-latest

    permissions:
        contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: DOCKER build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/setup-image:latest .

      - name: Docker Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/setup-image:latest

      - name: Deploy on Render
        run: curl -X POST ${{secrets.DEPLOY_HOOK}}

